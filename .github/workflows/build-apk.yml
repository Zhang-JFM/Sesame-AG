name: Build APK

# 手动触发：仓库 Actions 页 -> Build APK -> Run workflow
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "上游 tag / 分支 / commit"
        required: false
        default: "4400-0.2.7"
      appVersion:
        description: "versionName（经 -PappVersion 传入，上游默认 0.0.1）"
        required: false
        default: "0.2.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v5
        with:
          repository: Sesame-AG/Sesame-AG
          ref: ${{ inputs.ref || '4400-0.2.7' }}
          # versionCode 由 git rev-list --count HEAD 生成，必须完整历史
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      # 固定签名：把仓库 Secret 里的密钥库还原成 AGP 内置 debug signingConfig
      # 所期望的 ~/.android/debug.keystore（JKS / 别名 androiddebugkey / 口令 android）。
      # 上游 release 复用该 signingConfig，因此每次构建签名一致，可覆盖升级。
      - name: Restore fixed signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置 Secret KEYSTORE_BASE64，将使用 runner 随机 debug keystore，本次包签名为一次性，后续包无法覆盖安装"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ci-keystore.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/ci-keystore.p12" -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore "$HOME/.android/debug.keystore" -deststoretype JKS \
            -deststorepass android -destkeypass android
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -E "Alias name|Valid from|SHA256" || true

      # 上游 app/build.gradle.kts 中 release 已开启 R8 + 资源裁剪，
      # 且 signingConfig 复用 debug 签名，assembleRelease 直接产出已签名包。
      - name: Build release APK (R8)
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PappVersion="${{ inputs.appVersion || '0.2.7' }}"
          ls -lh app/build/outputs/apk/release/

      - name: Verify release signature
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for f in app/build/outputs/apk/release/*arm64*.apk; do
            echo "== $(basename "$f")"
            "$APKSIGNER" verify --print-certs "$f" | grep -E "SHA-256|DN:" || true
          done

      - name: Build debug APK
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
