name: Build Sesame-AG APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '分支或 tag'
        required: false
        default: '4400-0.2.7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v5
        with:
          repository: Sesame-AG/Sesame-AG
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMGR="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          echo "SDKMANAGER=$SDKMGR"
          "$SDKMGR" --version
          "$SDKMGR" --list | grep -iE "platforms;android-37" || true
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
